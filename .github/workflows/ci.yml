name: NCAIA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncaia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH with rollback on failure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.VPS_PATH }}
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREV_COMMIT"

            git pull origin main
            docker compose up -d --build

            echo "Waiting for health check..."
            sleep 15

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' ncaiausa-app || echo "unknown")

            if [ "$STATUS" != "healthy" ]; then
              echo "Deployment unhealthy (status: $STATUS). Rolling back to $PREV_COMMIT"
              git reset --hard "$PREV_COMMIT"
              docker compose up -d --build
              echo "Rollback complete."
              exit 1
            fi

            echo "Deployment healthy."
